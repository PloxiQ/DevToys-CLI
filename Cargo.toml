[package]
name = "devtoys-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A fast, offline developer toolbox for the terminal - CLI and TUI."
license = "MIT"
repository = "https://github.com/PloxiQ/DevToys-CLI"
homepage = "https://github.com/PloxiQ/DevToys-CLI"
readme = "README.md"
keywords = ["cli", "tui", "developer-tools", "devtools", "offline"]
categories = ["command-line-utilities", "development-tools"]
authors = ["PloxiQ"]

[[bin]]
name = "devtoys"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
deunicode = "1.6"
hmac = "0.12"
md-5 = "0.10"
mime_guess = "2"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-width = "0.2"
url = "2.5"
uuid = "1"

ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
